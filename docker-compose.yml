services:
  wb2api:
    # 镜像由 GitHub Actions 构建并推到 GHCR（.github/workflows/build-image.yml）。
    #   部署：docker compose pull && docker compose up -d --force-recreate
    #   回滚：把下面的 tag 换成不可变的 sha-<短sha>（历史 tag 见 PORTING.md §7）
    image: ghcr.io/yjzsg/workbuddy2api-panel:latest
    # [应急后备] 本地构建（需先把 Dockerfile 里的 alpine 源换成 NAS 可达的镜像站）。
    # ⚠️ 直接启用会卡在 `apk add`：dl-cdn.alpinelinux.org 从 NAS 不可达
    #（2026-09-28 实测；此前能过是因为该层还在构建缓存里）。这正是改用 CI 的动机。
    # build: .
    container_name: workbuddy2api
    restart: unless-stopped
    # 容器默认以 app 用户（uid 10001）运行。宿主机挂载目录属主不同会导致
    # 「写入 auths/*.json.tmp 失败 permission denied」，三种解法任选：
    #   1) 非 root · 让容器以你自己的 uid 运行（挂载目录本来就是你建的）：
    #      PUID=$(id -u) PGID=$(id -g) docker compose up -d
    #      或写进 .env 文件：PUID=1000 / PGID=1000
    #   2) sudo chown -R 10001:10001 ./auths ./data ./config.json
    #   3) user: "0:0" 以 root 运行（省事但容器逃逸面更大，自担）
    # [本地实测 2026-09-16] 上面解法 1（PUID=宿主 uid）**只对目录挂载有效** ——
    # 它对"程序要写回的单文件挂载"无效（父目录仍是镜像层权限）。
    # 已采用解法 2 的等价做法：容器跑镜像内置的 10001，
    # 宿主机 auths/ data/ 属主 chown 到 10001（NAS 上 sudo 不可用，借容器内 root 完成）。
    user: "${PUID:-10001}:${PGID:-10001}"
    # [本地补丁] 覆盖 ENTRYPOINT，把配置读写路径改到已挂载目录内。
    # 原因：./config.json 属"单文件 bind mount"，而保存配置走原子写
    # （写 .tmp -> rename 覆盖）。内核禁止 rename 覆盖挂载点，报
    # "device or resource busy"；且 .tmp 与挂载点不同文件系统。
    # 改到 /app/data/（目录挂载，与 .tmp 同 fs）后即可正常原子写。
    entrypoint: ["/app/wb2api", "-config", "/app/data/config.json"]
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "7863:7863"
    volumes:
      - ./auths:/app/auths
      - ./data:/app/data
      # [本地补丁] 原为 `- ./config.json:/app/config.json`，已移除：
      # 单文件挂载点无法被 rename 覆盖，面板保存配置必然失败。
      # 配置已迁至 ./data/config.json（路径由上面的 entrypoint 指定）。
      # 仓库根的 config.json 保留作参考，改它不再生效。
